<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <title>Ask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- Apply the saved theme before first paint so a reload never flashes the wrong colours. -->
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; if (localStorage.getItem("sidebar") === "closed") document.documentElement.classList.add("side-collapsed"); } catch {}</script>
  <script src="/vendor/marked.js"></script>
  <script src="/vendor/purify.js"></script>
</head>
<body class="is-empty">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-panel" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-new" viewBox="0 0 20 20"><path d="M9 3.5H6a2.5 2.5 0 0 0-2.5 2.5v8A2.5 2.5 0 0 0 6 16.5h8a2.5 2.5 0 0 0 2.5-2.5v-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m8.5 11.5.4-2.2 6.3-6.3a1.4 1.4 0 0 1 2 2l-6.3 6.3-2.4.2Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 20 20"><path d="M16.5 12.3A6.8 6.8 0 0 1 7.7 3.5a6.8 6.8 0 1 0 8.8 8.8Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2v1.8M10 16.2V18M2 10h1.8M16.2 10H18M4.3 4.3l1.3 1.3M14.4 14.4l1.3 1.3M4.3 15.7l1.3-1.3M14.4 5.6l1.3-1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 20 20"><path d="M10 15.5v-11M5 9.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 20 20"><path d="M10 4.5v11M5 10.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 20 20"><rect x="7" y="7" width="9.5" height="9.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13 4.6A1.8 1.8 0 0 0 11.3 3.5H5.2A1.7 1.7 0 0 0 3.5 5.2v6.1A1.8 1.8 0 0 0 4.6 13" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-retry" viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m4.5 10.5 3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 20 20"><path d="M6 14 14 6M7.5 6H14v6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </svg>

  <aside id="sidebar" aria-label="Threads">
    <div class="side-inner">
      <div class="side-head">
        <button class="icon-btn" id="collapse" aria-label="Hide sidebar" title="Hide sidebar"><svg><use href="#i-panel"/></svg></button>
        <div class="side-actions">
          <button class="icon-btn theme-toggle" type="button" aria-label="Switch theme"><svg class="moon"><use href="#i-moon"/></svg><svg class="sun"><use href="#i-sun"/></svg></button>
          <button class="icon-btn" id="new-chat" aria-label="New thread" title="New thread (Ctrl K)"><svg><use href="#i-new"/></svg></button>
        </div>
      </div>
      <nav id="conversations"></nav>
      <p class="side-note">Threads are saved on this computer. Ask about any of them later by date.</p>
    </div>
  </aside>
  <div id="scrim"></div>

  <main>
    <header class="topbar">
      <button class="icon-btn" id="expand" aria-label="Show sidebar" title="Show sidebar"><svg><use href="#i-panel"/></svg></button>
      <span class="brand" id="title">Ask</span>
      <div class="side-actions">
        <button class="icon-btn theme-toggle" type="button" aria-label="Switch theme"><svg class="moon"><use href="#i-moon"/></svg><svg class="sun"><use href="#i-sun"/></svg></button>
        <button class="icon-btn" id="new-chat-top" aria-label="New thread" title="New thread (Ctrl K)"><svg><use href="#i-new"/></svg></button>
      </div>
    </header>

    <div id="thread" tabindex="-1">
      <section class="hero" id="hero">
        <h1>What do you want to know?</h1>
        <p>Answers are searched, cited and dated. Come back any day and ask whether they still hold.</p>
      </section>
    </div>

    <div class="dock">
      <button id="jump" class="jump" hidden aria-label="Jump to latest"><svg><use href="#i-down"/></svg></button>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Ask anything" autocomplete="off" autofocus aria-label="Message"></textarea>
        <div class="composer-row">
          <span class="hint"><kbd>Enter</kbd> to send, <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
          <button id="send" type="submit" aria-label="Send" disabled><svg class="go"><use href="#i-up"/></svg><span class="stop-icon"></span></button>
        </div>
      </form>
      <div class="starters" id="starters">
        <button>Shortlist 5 CRMs for a 20 person sales team</button>
        <button>Cheapest managed Postgres right now</button>
        <button>What did I ask you on 3 November? Still correct?</button>
      </div>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
